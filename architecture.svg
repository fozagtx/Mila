<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1320" viewBox="0 0 2200 1320" role="img" aria-labelledby="title desc">
  <title id="title">Mila architecture</title>
  <desc id="desc">You upload a text PDF to the Mila web app. Next.js extracts the text and invokes Amazon Bedrock AgentCore Runtime, which calls Amazon Nova on Bedrock and returns a risk score, plain-English jargon, and a negotiation email.</desc>
  <defs>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E2A44" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#1E2A44"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#C4641F"/>
    </marker>
  </defs>

  <rect width="2200" height="1320" fill="#F0E7D5"/>
  <rect x="48" y="48" width="2104" height="1224" rx="28" fill="#F6F0E4" stroke="#1E2A44" stroke-width="2"/>

  <text x="88" y="118" font-family="Georgia, serif" font-size="46" font-style="italic" fill="#1E2A44">Mila</text>
  <text x="210" y="118" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1E2A44" opacity="0.55">Architecture</text>
  <text x="2112" y="108" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1E2A44" opacity="0.5">Amazon Web Services  |  us-west-2</text>
  <text x="88" y="158" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1E2A44" opacity="0.72">An AI employee for negotiating your deals. The employee only reads the PDF you upload.</text>
  <line x1="88" y1="182" x2="2112" y2="182" stroke="#1E2A44" stroke-opacity="0.12" stroke-width="1.5"/>

  <g filter="url(#soft)">
    <rect x="88" y="380" width="280" height="300" rx="22" fill="#FFFFFF" stroke="#1E2A44" stroke-width="2"/>
  </g>
  <circle cx="228" cy="480" r="28" fill="none" stroke="#1E2A44" stroke-width="2.5"/>
  <path d="M190 562c8-42 68-42 76 0" fill="none" stroke="#1E2A44" stroke-width="2.5" stroke-linecap="round"/>
  <text x="228" y="612" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E2A44">You</text>
  <text x="228" y="640" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1E2A44" opacity="0.6">Upload a text PDF</text>
  <rect x="108" y="362" width="240" height="36" rx="18" fill="#1E2A44"/>
  <text x="228" y="386" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F0E7D5">1  |  Contract</text>

  <line x1="368" y1="530" x2="454" y2="530" stroke="#1E2A44" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="411" y="512" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E2A44" opacity="0.55">PDF</text>

  <g filter="url(#soft)">
    <rect x="468" y="300" width="420" height="540" rx="22" fill="#FFFFFF" stroke="#1E2A44" stroke-width="2"/>
  </g>
  <rect x="488" y="282" width="240" height="36" rx="18" fill="#1E2A44"/>
  <text x="608" y="306" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F0E7D5">2  |  Application</text>
  <text x="678" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E2A44">Mila web app</text>
  <text x="678" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1E2A44" opacity="0.6">Next.js 14  |  TypeScript</text>

  <rect x="498" y="418" width="360" height="88" rx="14" fill="#F6F0E4" stroke="#1E2A44" stroke-opacity="0.18"/>
  <text x="678" y="456" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E2A44">POST /api/review</text>
  <text x="678" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2A44" opacity="0.65">Accepts the PDF, 10 MB max</text>

  <rect x="498" y="522" width="360" height="88" rx="14" fill="#F6F0E4" stroke="#1E2A44" stroke-opacity="0.18"/>
  <text x="678" y="560" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E2A44">Extract text</text>
  <text x="678" y="584" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2A44" opacity="0.65">unpdf  |  text layer only</text>

  <rect x="498" y="626" width="360" height="176" rx="14" fill="#F6F0E4" stroke="#1E2A44" stroke-opacity="0.18"/>
  <text x="678" y="662" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1E2A44">Three windows</text>
  <text x="678" y="692" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2A44">Risk  |  score 1-4</text>
  <text x="678" y="716" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2A44">What this really means</text>
  <text x="678" y="740" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2A44">Give them this  |  email</text>
  <text x="678" y="776" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E2A44" opacity="0.55">Have a lawyer read the final contract</text>

  <line x1="888" y1="456" x2="978" y2="456" stroke="#1E2A44" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="933" y="438" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E2A44" opacity="0.55">InvokeAgentRuntime</text>

  <rect x="992" y="214" width="1120" height="900" rx="26" fill="#FFFFFF" stroke="#C4641F" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="1016" y="238" width="460" height="36" rx="18" fill="#C4641F"/>
  <text x="1246" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF">3  |  Amazon Web Services  |  us-west-2</text>

  <g filter="url(#soft)">
    <rect x="1032" y="300" width="320" height="150" rx="16" fill="#F6F0E4" stroke="#1E2A44" stroke-width="1.75"/>
  </g>
  <text x="1192" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E2A44">Amazon ECR</text>
  <text x="1192" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2A44" opacity="0.7">mila-deal:latest</text>
  <text x="1192" y="404" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2A44" opacity="0.7">linux/arm64 container</text>

  <g filter="url(#soft)">
    <rect x="1372" y="300" width="320" height="150" rx="16" fill="#F6F0E4" stroke="#1E2A44" stroke-width="1.75"/>
  </g>
  <text x="1532" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E2A44">AWS IAM</text>
  <text x="1532" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2A44" opacity="0.7">MilaAgentCoreRole</text>
  <text x="1532" y="404" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2A44" opacity="0.7">InvokeModel, ECR pull, logs</text>

  <g filter="url(#soft)">
    <rect x="1712" y="300" width="360" height="150" rx="16" fill="#F6F0E4" stroke="#1E2A44" stroke-width="1.75"/>
  </g>
  <text x="1892" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E2A44">Amazon CloudWatch</text>
  <text x="1892" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2A44" opacity="0.7">/aws/bedrock-agentcore/*</text>
  <text x="1892" y="404" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1E2A44" opacity="0.7">Runtime logs</text>

  <g filter="url(#soft)">
    <rect x="1032" y="500" width="1040" height="250" rx="18" fill="#1E2A44"/>
  </g>
  <text x="1552" y="560" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F0E7D5">Amazon Bedrock AgentCore Runtime</text>
  <text x="1552" y="592" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#F0E7D5" opacity="0.75">MilaDeal  |  Strands agent  |  HTTP /invocations</text>
  <rect x="1120" y="620" width="280" height="86" rx="12" fill="#F0E7D5"/>
  <text x="1260" y="656" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E2A44">Score risk 1-4</text>
  <text x="1260" y="680" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E2A44" opacity="0.65">critical, high, medium, low</text>
  <rect x="1428" y="620" width="280" height="86" rx="12" fill="#F0E7D5"/>
  <text x="1568" y="656" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E2A44">Explain jargon</text>
  <text x="1568" y="680" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E2A44" opacity="0.65">plain English from this PDF</text>
  <rect x="1736" y="620" width="280" height="86" rx="12" fill="#F0E7D5"/>
  <text x="1876" y="656" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E2A44">Write the email</text>
  <text x="1876" y="680" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E2A44" opacity="0.65">copy and send</text>

  <line x1="1192" y1="450" x2="1192" y2="492" stroke="#1E2A44" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1532" y1="450" x2="1532" y2="492" stroke="#1E2A44" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1892" y1="492" x2="1892" y2="450" stroke="#1E2A44" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1248" y="478" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E2A44" opacity="0.5">pull image</text>
  <text x="1572" y="478" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E2A44" opacity="0.5">assume role</text>
  <text x="1910" y="478" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1E2A44" opacity="0.5">write logs</text>

  <line x1="1552" y1="750" x2="1552" y2="798" stroke="#C4641F" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="1570" y="780" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#C4641F">InvokeModel</text>

  <g filter="url(#soft)">
    <rect x="1032" y="806" width="1040" height="160" rx="18" fill="#F6F0E4" stroke="#C4641F" stroke-width="2"/>
  </g>
  <text x="1552" y="868" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E2A44">Amazon Bedrock  |  Amazon Nova Lite</text>
  <text x="1552" y="900" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1E2A44" opacity="0.7">amazon.nova-lite-v1:0  |  structured DealReview JSON</text>
  <text x="1552" y="928" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1E2A44" opacity="0.7">The only model provider. No mock contracts. No canned reviews.</text>

  <path d="M 992 900 L 930 900 L 930 1108 L 678 1108 L 678 848" fill="none" stroke="#1E2A44" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="804" y="1092" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1E2A44" opacity="0.55">review JSON</text>

  <text x="88" y="1224" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1E2A44" opacity="0.55">Flow: PDF -&gt; extract text -&gt; AgentCore Runtime -&gt; Nova -&gt; risk, jargon, email. Locally the same employee can run at localhost:8080.</text>
</svg>
